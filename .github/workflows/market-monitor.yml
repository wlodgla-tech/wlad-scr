name: Market Monitor

on:
  schedule:
    # Раз на 5 хв. Репозиторій публічний — ліміт хвилин GitHub Actions
    # необмежений, тож можна частіше. Сигнали рахуються по годинних (1h)
    # і денних (1d) свічках, тож нова інформація зʼявляється не частіше
    # ніж раз на годину — частіші перевірки лише зменшують затримку
    # реакції на вже готовий сигнал, не дають нових даних.
    - cron: '*/5 * * * *'
  workflow_dispatch: {}   # кнопка "Run workflow" для ручного тесту

permissions:
  contents: write   # потрібно, щоб зберігати файл стану (дедуплікація сповіщень)
concurrency:
  group: market-monitor
  cancel-in-progress: false
jobs:
  check-market:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run market monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TICKER: ${{ vars.TICKER }}
          INTERVAL: ${{ vars.INTERVAL }}
          TRADING212_API_KEY: ${{ secrets.TRADING212_API_KEY }}
          TRADING212_API_SECRET: ${{ secrets.TRADING212_API_SECRET }}
          TRADING212_MODE: ${{ vars.TRADING212_MODE }}
          TRADING212_DRY_RUN: ${{ vars.TRADING212_DRY_RUN }}
          MAX_PER_TRADE_GBP: ${{ vars.MAX_PER_TRADE_GBP }}
          MAX_DAILY_GBP: ${{ vars.MAX_DAILY_GBP }}
          STOP_LOSS_PCT: ${{ vars.STOP_LOSS_PCT }}
          MAX_OPEN_POSITIONS: ${{ vars.MAX_OPEN_POSITIONS }}
          MAX_POSITIONS_PER_SECTOR: ${{ vars.MAX_POSITIONS_PER_SECTOR }}
          AVOID_EARNINGS_DAYS: ${{ vars.AVOID_EARNINGS_DAYS }}
          DRAWDOWN_PAUSE_GBP: ${{ vars.DRAWDOWN_PAUSE_GBP }}
        run: python main.py

      - name: Save state and dashboard back to repo
        run: |
          git config user.name "market-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add monitor_state_*.json docs/index.html docs/alerts_log.json
          [ -f trading_state.json ] && git add trading_state.json || true
          [ -f t212_instruments_cache.json ] && git add t212_instruments_cache.json || true
          git diff --staged --quiet || git commit -m "Update dashboard and monitor state [skip ci]"
          # При частих запусках (кожні 5 хв) іноді два запуски намагаються
          # зберегти результат одночасно — git push одного з них відхиляється,
          # бо інший вже встиг запушити першим. Замість падати з помилкою,
          # підтягуємо свіжі зміни і пробуємо запушити ще раз (до 5 спроб).
          for i in 1 2 3 4 5; do
            if git push; then
              break
            fi
            echo "Push відхилено (спроба $i), підтягую свіжі зміни і пробую ще раз..."
            git pull --rebase --autostash
            sleep 3
          done
