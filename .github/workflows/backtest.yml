name: Backtest

# Дослідницький інструмент — запускається ТІЛЬКИ вручну кнопкою
# "Run workflow", ніколи за розкладом. Нічого не торгує, не чіпає
# monitor_state_*.json чи trading_state.json живого бота.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backtest
        env:
          BACKTEST_TICKERS: ${{ vars.BACKTEST_TICKERS }}
          BACKTEST_YEARS: ${{ vars.BACKTEST_YEARS }}
          MAX_PER_TRADE_GBP: ${{ vars.MAX_PER_TRADE_GBP }}
          STOP_LOSS_PCT: ${{ vars.STOP_LOSS_PCT }}
        run: python backtest.py

      - name: Save report back to repo
        run: |
          git config user.name "market-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/backtest.html docs/backtest_results.json
          git diff --staged --quiet || git commit -m "Update backtest report [skip ci]"
          git push
