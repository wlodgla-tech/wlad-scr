name: Market Monitor

on:
  schedule:
    # Раз на 30 хв. Частіше — ризик вичерпати безкоштовний ліміт хвилин
    # GitHub Actions (private repo: ~2000 хв/міс).
    - cron: '*/30 * * * *'
  workflow_dispatch: {}   # кнопка "Run workflow" для ручного тесту

permissions:
  contents: write   # потрібно, щоб зберігати файл стану (дедуплікація сповіщень)

jobs:
  check-market:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run market monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TICKER: ${{ vars.TICKER }}
          INTERVAL: ${{ vars.INTERVAL }}
          TRADING212_API_KEY: ${{ secrets.TRADING212_API_KEY }}
          TRADING212_MODE: ${{ vars.TRADING212_MODE }}
          TRADING212_DRY_RUN: ${{ vars.TRADING212_DRY_RUN }}
          MAX_PER_TRADE_GBP: ${{ vars.MAX_PER_TRADE_GBP }}
          MAX_DAILY_GBP: ${{ vars.MAX_DAILY_GBP }}
          STOP_LOSS_PCT: ${{ vars.STOP_LOSS_PCT }}
        run: python main.py

      - name: Save state and dashboard back to repo
        run: |
          git config user.name "market-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add monitor_state_*.json docs/index.html docs/alerts_log.json
          [ -f trading_state.json ] && git add trading_state.json || true
          [ -f t212_instruments_cache.json ] && git add t212_instruments_cache.json || true
          git diff --staged --quiet || git commit -m "Update dashboard and monitor state [skip ci]"
          git push
